name: Deploy Aether OS to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun (repo is bun.lock-locked)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (40 specs must pass before deploy)
        run: bun run test

      - name: Build production bundle
        # Pages serves project sites under /<repo-name>/ — derive it from the
        # repo so asset paths always match, even after a rename.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Setup Pages
        # enablement: true flips Pages on for the repo (Source: GitHub Actions)
        # on first deploy — no manual Settings → Pages step needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
